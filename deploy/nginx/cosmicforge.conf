# HTTPS reverse proxy in front of the trading backend. OPTIONAL: install it only
# if something outside the server must reach the API. Trading itself needs no
# inbound connection at all.
#
# The backend stays bound to 127.0.0.1:9000. Port 9000 is never opened in the
# firewall; the only public ports are 80 (redirect + certificate renewal) and 443.
#
# Install (the certificate is obtained FIRST, so this file is valid when enabled):
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo certbot certonly --nginx -d YOUR.DOMAIN
#   sudo cp deploy/nginx/cosmicforge.conf /etc/nginx/sites-available/cosmicforge.conf
#   sudo sed -i 's/trading.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/cosmicforge.conf
#   sudo ln -s /etc/nginx/sites-available/cosmicforge.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl enable --now certbot.timer   # renewal
#
# Before exposing the API: set strong, non-default SECRET_KEY and
# ENGINE_API_KEY in the backend .env (see docs/VPS_TRADING_DEPLOYMENT.md).

upstream cosmicforge_backend {
    server 127.0.0.1:9000;
    keepalive 16;
}

# Per-client request budget for the API.
limit_req_zone $binary_remote_addr zone=cosmicforge_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name trading.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trading.example.com;

    # Issued by `certbot certonly --nginx -d YOUR.DOMAIN` (see the header).
    ssl_certificate     /etc/letsencrypt/live/trading.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cosmicforge_tls:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Server-sent events: no buffering, long-lived.
    location /api/v1/events {
        limit_req zone=cosmicforge_api burst=20 nodelay;
        proxy_pass http://cosmicforge_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Operational endpoints stay on the server. Use them over SSH:
    #   curl -s 'http://127.0.0.1:9000/health?ready=1'
    location /health  { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://cosmicforge_backend; }
    location /debug/  { deny all; }
    location /runner/ { deny all; }
    location /binance/ { deny all; }
    location /docs    { deny all; }
    location /redoc   { deny all; }
    location = /openapi.json { deny all; }

    location / {
        limit_req zone=cosmicforge_api burst=40 nodelay;
        proxy_pass http://cosmicforge_backend;
    }
}
