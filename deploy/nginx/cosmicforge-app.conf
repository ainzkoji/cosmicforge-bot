# HTTPS front end for the web application: the customer site, the admin
# console and the APIs behind them. Independent of deploy/nginx/cosmicforge.conf
# (direct access to the trading API), which most installations do not need.
#
#   https://app.example.com     customer SPA  + user backend      127.0.0.1:8000
#   https://admin.example.com   admin SPA     + user backend      127.0.0.1:8000
#                                             + admin backend     127.0.0.1:8100  (under /admin-api/)
#
# Every backend stays bound to 127.0.0.1. The only public ports are 80
# (redirect + certificate renewal) and 443.
#
# The built frontends are COPIED to /var/www/cosmicforge. nginx does not serve
# them from the checkout: /opt/cosmicforge is closed to other users (mode
# 0750) and holds the .env files, and nginx's user must not be let in.
#
# Build (anywhere with Node 20+; the API addresses are compiled in, and an
# empty value silently falls back to http://localhost:8000):
#   cd frontends/user-frontend  && npm ci && \
#     VITE_API_BASE=https://app.example.com VITE_API_URL=https://app.example.com \
#     VITE_CATI_API_BASE=https://app.example.com npm run build
#   cd frontends/admin-frontend && npm ci && \
#     VITE_API_BASE=https://admin.example.com VITE_ADMIN_API_BASE=https://admin.example.com/admin-api npm run build
#   (keep the VITE_USE_ADMIN_BACKEND_* flags of frontends/admin-frontend/.env.example)
#
# Install (certificates FIRST, so this file is valid when enabled):
#   sudo apt-get install -y nginx certbot python3-certbot-nginx rsync
#   sudo certbot certonly --nginx -d APP.DOMAIN -d ADMIN.DOMAIN      # one certificate, stored under the first name
#   sudo install -d -o root -g root -m 0755 /var/www/cosmicforge/app /var/www/cosmicforge/admin
#   sudo rsync -a --delete frontends/user-frontend/dist/  /var/www/cosmicforge/app/
#   sudo rsync -a --delete frontends/admin-frontend/dist/ /var/www/cosmicforge/admin/
#   sudo cp deploy/nginx/cosmicforge-app.conf /etc/nginx/sites-available/cosmicforge-app.conf
#   sudo sed -i 's/admin\.example\.com/ADMIN.DOMAIN/g; s/app\.example\.com/APP.DOMAIN/g' /etc/nginx/sites-available/cosmicforge-app.conf
#   sudo ln -s /etc/nginx/sites-available/cosmicforge-app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl enable --now certbot.timer   # renewal
#   sudo ufw allow 'Nginx Full'
#
# Before exposing it: all three backends must share one strong SECRET_KEY, the
# user backend needs FRONTEND_URL=https://APP.DOMAIN, and the admin server
# block below should be limited to your own addresses.
# Guide: docs/VPS_TRADING_DEPLOYMENT.md, section 10.

upstream cosmicforge_user_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream cosmicforge_admin_backend {
    server 127.0.0.1:8100;
    keepalive 8;
}

# The trading backend. Exactly one of its routes is published here (see
# "CATI runtime status" below); everything else on it stays local.
upstream cosmicforge_trading_backend {
    server 127.0.0.1:9000;
    keepalive 4;
}

# Per-client request budget for the API: the same key and rate as
# cosmicforge.conf (the zone names differ so both files can be enabled).
limit_req_zone $binary_remote_addr zone=cosmicforge_app_api:10m rate=20r/s;
# Credential endpoints (login, register, password reset, codes). A coarse
# outer limit: the backend keeps its own durable per-account and per-address
# limits in the database.
limit_req_zone $binary_remote_addr zone=cosmicforge_app_auth:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com admin.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# -- Customer application -----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    # Issued by `certbot certonly --nginx -d APP.DOMAIN -d ADMIN.DOMAIN` (see the header).
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cosmicforge_tls:10m;
    ssl_session_timeout 1d;

    # Security headers. They are set HERE ONLY, at server level: a location
    # that used add_header would silently drop all of them for its responses
    # (which is why caching below uses `expires`, not add_header).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Content-Security-Policy for the built (Vite) application: its scripts and
    # styles are files of this origin, and the API is this origin too, so
    # everything is 'self' except what is listed here:
    #   style-src 'unsafe-inline'   React/framer-motion/recharts set style="" attributes
    #   img-src data: blob:         QR codes, chart exports, the KYC selfie preview
    #   img-src https://www.google.com        the Google icon on the login page (favicon.ico)
    #   script-src https://www.gstatic.com    firebase-messaging-sw.js loads the Firebase
    #                                         SDK from there (importScripts) for web push
    #   connect-src https://firebaseinstallations.googleapis.com
    #               https://fcmregistrations.googleapis.com
    #                                         Firebase Cloud Messaging token registration
    # No web fonts or other third-party origins are used. If web push stays
    # unconfigured (src/config/firebase.ts still holds placeholders) the gstatic
    # and googleapis entries can be removed. If the API is ever served from a
    # different origin, add that origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com; connect-src 'self' https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2m;
    server_tokens off;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The address nginx saw, not a list the client can prepend to: the user
    # backend keys its login limits on it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    # The user backend adds its own copies of these headers to API responses;
    # without this a response would carry each twice, with different values.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;

    root /var/www/cosmicforge/app;
    index index.html;

    # Server-sent events (backends/user-backend/app/api/events_proxy.py, the
    # only stream: GET /api/v1/events/stream): no buffering, long-lived.
    # EventSource cannot send headers, so the access token travels in the
    # query string -- keep it out of the access log.
    location /api/v1/events/ {
        limit_req zone=cosmicforge_app_api burst=20 nodelay;
        proxy_pass http://cosmicforge_user_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }

    # Credential endpoints: the stricter budget.
    location ~ ^/api/v1/auth/(login|register|verify-email|resend-verification|forgot-password|reset-password|2fa/verify)$ {
        limit_req zone=cosmicforge_app_auth burst=10 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }

    # KYC document upload (PUT /kyc/documents/upload/<ref>): the only route
    # that accepts a large body. The backend enforces 10 MB itself; the extra
    # megabyte lets it answer an oversized upload with its own message.
    location /kyc/documents/upload/ {
        limit_req zone=cosmicforge_app_api burst=20 nodelay;
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://cosmicforge_user_backend;
    }

    # CATI runtime status: the one request the customer application sends to
    # the TRADING backend (VITE_CATI_API_BASE). It requires the user's token
    # there. Published on this origin because the trading backend allows
    # browser calls (CORS) from localhost only.
    location = /api/v1/cati/runtime/status {
        limit_req zone=cosmicforge_app_api burst=20 nodelay;
        proxy_pass http://cosmicforge_trading_backend;
    }

    # The admin API is published on the admin host only, so that restricting
    # that host by address actually restricts it.
    location ^~ /api/admin/         { return 404; }
    location ^~ /api/v1/admin-auth/ { return 404; }

    # Everything else the application calls on the user backend:
    #   /api/...   the API (also the Stripe and Telegram webhooks:
    #              /api/billing/webhook, /api/notifications/telegram/webhook)
    #   /kyc/...   KYC steps        /public/...   marketing-page content
    # /health, /docs, /redoc and /openapi.json are not published.
    location /api/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }
    location /kyc/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }
    location /public/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }

    # Static application. /assets/* carry a content hash in their names and
    # never change; the HTML entry points (index.html and the second entry,
    # cati.html) must be revalidated so a deploy is picked up at once.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html { expires -1; }
    location = /cati.html  { expires -1; }
    location = /firebase-messaging-sw.js { expires -1; }
    # Single-page application: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}

# -- Admin console ------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    # Restrict the whole admin console (pages AND admin API) to your own
    # addresses. Strongly recommended; uncomment and edit:
    # allow 203.0.113.10;        # <office-ip>
    # allow 198.51.100.0/24;     # <vpn-range>
    # deny all;

    # The certificate of the customer host also names this host (see the header).
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cosmicforge_tls:10m;
    ssl_session_timeout 1d;

    # As above. The admin application loads nothing from another origin.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    #   style-src 'unsafe-inline'   style="" attributes set by the UI libraries
    #   img-src data: blob:         QR codes, and KYC documents shown from memory during review
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 2m;
    server_tokens off;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;

    root /var/www/cosmicforge/admin;
    index index.html;

    # Admin backend (read-only reporting). Both backends serve paths that begin
    # with /api/admin/ -- the console chooses between them by BASE URL
    # (VITE_ADMIN_API_BASE), not by path -- so the admin backend gets a prefix
    # of its own, removed here:
    #   /admin-api/api/admin/dashboard/...  ->  127.0.0.1:8100/api/admin/dashboard/...
    # Only its /api/admin/ tree is published (not /health, /docs, /openapi.json).
    location /admin-api/api/admin/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_admin_backend/api/admin/;
    }

    # Admin sign-in (served by the user backend): the stricter budget.
    location ~ ^/api/v1/admin-auth/(login|register|verify-email|resend-verification|forgot-password|reset-password)$ {
        limit_req zone=cosmicforge_app_auth burst=10 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }

    # Kill switch / flatten. The user backend waits up to 120 s for the
    # trading backend to close positions; a shorter proxy timeout would show
    # an error while the action is still running.
    location /api/admin/emergency/ {
        limit_req zone=cosmicforge_app_api burst=20 nodelay;
        proxy_read_timeout 150s;
        proxy_pass http://cosmicforge_user_backend;
    }

    # User backend: admin sessions (/api/v1/admin-auth/), every admin action,
    # the admin reads not yet moved to the admin backend, and the paths the
    # console shares with the customer application (/public/, /monitoring/).
    location /api/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }
    location /public/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }
    location /monitoring/ {
        limit_req zone=cosmicforge_app_api burst=40 nodelay;
        proxy_pass http://cosmicforge_user_backend;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html { expires -1; }
    # Single-page application: any other path is a client-side route.
    location / {
        try_files $uri /index.html;
    }
}
