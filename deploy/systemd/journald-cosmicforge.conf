# Persistent, bounded logs for the trading service.
#
# Install:  sudo mkdir -p /etc/systemd/journald.conf.d
#           sudo cp deploy/systemd/journald-cosmicforge.conf /etc/systemd/journald.conf.d/cosmicforge.conf
#           sudo systemctl restart systemd-journald
#
# The runtime writes every line to stdout/stderr and systemd captures it:
# startup revision and runtime session, lease takeover and release, hourly CATI
# decisions, every execution decision with its reason, broker mutation
# results, protection and reconciliation, supervisor verdicts and restarts.
# Secrets are redacted by the application before a line is emitted.

[Journal]
# On disk, surviving a reboot (the default "auto" is volatile on some images).
Storage=persistent
Compress=yes
# Keep a month, never more than 2 GB, and always leave 1 GB of disk free.
MaxRetentionSec=30day
SystemMaxUse=2G
SystemKeepFree=1G
# One burst of evaluation lines must not cause the rest to be dropped.
RateLimitIntervalSec=30s
RateLimitBurst=20000
