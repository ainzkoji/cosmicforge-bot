# CosmicForge staging stack (Section H, Step 5.6). Production-representative topology on one host:
#
#   postgres          shared platform database (assignments, jobs, order budgets, launch records)
#   migrate           one-shot: applies the versioned platform migrations, then exits; every service waits for it
#   bot-trading       PROCESS_ROLE=trading: the ONLY process that may hold the runtime-ownership lease
#                     (exactly one replica; it owns the canonical broker cycle, stop management and the shadow
#                     scheduler). Graceful stop = SIGTERM -> runtime quiesce; exchange-side stops stay resting.
#   bot-api           PROCESS_ROLE=api: customer/admin HTTP of the bot backend; never trades (2 replicas)
#   user-backend      portal API (users and admins)
#   admin-backend     admin read models
#   user-frontend / admin-frontend   static portals
#   healthcheck       readiness probe of the trading process every 2 minutes (scripts/vps_health_check.py)
#   bot-trading-assigned  OPTIONAL second trading worker, profile "multi-worker", OFF by default (see its entry)
#
# Volumes: pg-data (platform database), runtime-state (runtime SQLite database and its online backups), and
# golive-anchor: the go-live revocation anchor (GOLIVE_REVOCATION_ANCHOR), deliberately NOT in either database
# volume and never touched by restore.sh, so a restored database cannot resurrect a revoked authorization. On the
# staging host point GOLIVE_ANCHOR_SOURCE at a directory on separate storage (a bind mount owned by uid 10001);
# the named volume is the single-disk default. Container logs rotate (json-file, 5 x 50 MB); deploy.sh archives
# the outgoing containers' logs into .deploy-state/logs before it replaces them.
#
# Secrets are never in this file or in an image: they come from STAGING_ENV_FILE (default ./staging.env,
# created from staging.env.example and kept outside version control). Staging trades nothing: the env file
# keeps LIVE_ORDER_SUBMISSION_ENABLED=false and DEMO_ORDER_SUBMISSION_ENABLED=false, and the CATI gates refuse
# every uncertified family regardless.
name: cosmicforge-staging

x-backend: &backend
  env_file:
    - ${STAGING_ENV_FILE:-./staging.env}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "5"}
  depends_on:
    migrate: {condition: service_completed_successfully}
  volumes:
    - runtime-state:/var/lib/cosmicforge

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmicforge
      POSTGRES_DB: cosmicforge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmicforge -d cosmicforge"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  migrate:
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    env_file:
    - ${STAGING_ENV_FILE:-./staging.env}
    depends_on:
      postgres: {condition: service_healthy}
    working_dir: /srv/cosmicforge/backends/shared
    command: ["python", "-m", "shared_lib.persistence.sql", "migrate"]
    restart: "no"

  bot-trading:
    <<: *backend
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PROCESS_ROLE: trading
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
      GOLIVE_REVOCATION_ANCHOR: /var/lib/cosmicforge-anchor/golive-revocations.jsonl
    volumes:
      - runtime-state:/var/lib/cosmicforge
      - ${GOLIVE_ANCHOR_SOURCE:-golive-anchor}:/var/lib/cosmicforge-anchor
    stop_signal: SIGTERM
    # Drain budget: HTTP graceful shutdown 20 s (image CMD) + cycle 15 s + production broker cycle 30 s, then the
    # lease release (worst case ~65 s). 120 s leaves room; deploy.sh refuses a grace below 75 s and records how each
    # stop ended (.deploy-state/drain-*.jsonl).
    stop_grace_period: 120s
    deploy: {replicas: 1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8000/health?ready=1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 120s

  bot-api:
    <<: *backend
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
      GOLIVE_REVOCATION_ANCHOR: /var/lib/cosmicforge-anchor/golive-revocations.jsonl
    volumes:
      - runtime-state:/var/lib/cosmicforge
      - ${GOLIVE_ANCHOR_SOURCE:-golive-anchor}:/var/lib/cosmicforge-anchor
    deploy: {replicas: 2}

  # OPTIONAL -- OFF BY DEFAULT (profile "multi-worker": COMPOSE_PROFILES=multi-worker enables it, and deploy.sh then
  # drains and replaces it after bot-trading, through the same release gate). A second trading-role process that
  # works only the accounts it holds through durable worker assignments in the platform PostgreSQL
  # (BROKER_CYCLE_ASSIGNMENT_MODE=assigned, app/platform_workers/broker_assignment.py). Do NOT enable it before:
  #   1. the owner's rollout decision on the assignment mode is recorded; then every trading process runs
  #      BROKER_CYCLE_ASSIGNMENT_MODE=assigned (set it in staging.env, which bot-trading reads);
  #   2. the runtime-owner lease can judge a holder in ANOTHER container: today it decides liveness by PID, and
  #      containers have separate PID namespaces, so this process could take over bot-trading's live lease
  #      (staging runbook, "Multi-worker topology");
  #   3. a production-profile readiness contract exists for a trading process that does not hold that lease.
  bot-trading-assigned:
    <<: *backend
    profiles: ["multi-worker"]
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PROCESS_ROLE: trading
      BROKER_CYCLE_ASSIGNMENT_MODE: assigned
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
      GOLIVE_REVOCATION_ANCHOR: /var/lib/cosmicforge-anchor/golive-revocations.jsonl
    volumes:
      - runtime-state:/var/lib/cosmicforge
      - ${GOLIVE_ANCHOR_SOURCE:-golive-anchor}:/var/lib/cosmicforge-anchor
    stop_signal: SIGTERM
    stop_grace_period: 120s
    deploy: {replicas: 1}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8000/health?ready=1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 120s

  user-backend:
    <<: *backend
    image: cosmicforge/user-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
      BOT_BACKEND_URL: http://bot-trading:8000
    ports: ["127.0.0.1:18000:8000"]

  admin-backend:
    <<: *backend
    image: cosmicforge/admin-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
    ports: ["127.0.0.1:18100:8000"]

  user-frontend:
    image: cosmicforge/user-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    ports: ["127.0.0.1:18080:8080"]
    restart: unless-stopped

  admin-frontend:
    image: cosmicforge/admin-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    ports: ["127.0.0.1:18081:8080"]
    restart: unless-stopped

  healthcheck:
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    env_file:
    - ${STAGING_ENV_FILE:-./staging.env}
    working_dir: /srv/cosmicforge
    command: ["sh", "-c", "while true; do python scripts/vps_health_check.py --url http://bot-trading:8000 || true; sleep 120; done"]
    depends_on: [bot-trading]
    restart: unless-stopped

  # The operations tick (Section H Step 8.5): alert evaluators over the platform and runtime databases, escalation
  # and delivery, every 60 s, as a long-running loop. Ownership is a lease in the platform database (fencing token,
  # database clock), so a second replica or a leftover container only waits and takes over after the lease
  # expires; SIGTERM releases it. Reads the runtime SQLite database read-mostly; never trades.
  ops-tick:
    <<: *backend
    image: cosmicforge/bot-backend:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      PROCESS_ROLE: api
      DATABASE_URL: sqlite:////var/lib/cosmicforge/cosmicforge.db
    command: ["python", "-u", "-m", "app.ops.alerting", "--loop", "--interval", "60",
              "--disk-path", "/var/lib/cosmicforge"]
    stop_signal: SIGTERM
    stop_grace_period: 90s
    deploy: {replicas: 1}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}

volumes:
  pg-data: {}
  runtime-state: {}
  golive-anchor: {}
