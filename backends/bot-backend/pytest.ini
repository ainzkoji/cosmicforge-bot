# Canonical pytest configuration for the bot-backend component.
#
# Canonical invocation (from backends/bot-backend), using backends/venv --
# the SAME interpreter that runs the bot server. The repository-root venv/ is a
# second, partially-provisioned environment and must not be used for tests: it
# drifts from the server (e.g. it was missing apscheduler, which failed 15
# scheduler tests for reasons unrelated to the code under test).
#     ../venv/Scripts/python.exe -m pytest tests -q
#
# rootdir is pinned here so `app` and `shared_lib` resolve identically whether
# tests are launched from this directory or from the repository root.
[pytest]
testpaths = tests
norecursedirs = integration __pycache__ .pytest_cache tmp_shadow models
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: hits a live external service; excluded from the default run
    slow: long-running test
