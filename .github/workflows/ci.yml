name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test jobs never inherit the default production profile or runtime DB.
# DATABASE_URL is set per job from $RUNNER_TEMP (the `runner` context is not
# available in job-level `env`, which previously made this whole file invalid).
env:
  APP_ENV: TEST
  COSMICFORGE_TEST_MODE: "1"
  DATABASE_ROLE: test
  ENVIRONMENT_NAME: test
  PYTHONPATH: ${{ github.workspace }}/.github/scripts
  LIVE_ORDER_SUBMISSION_ENABLED: "false"
  EXECUTION_MODE: paper
  BINANCE_API_KEY: mock_ci_key
  BINANCE_API_SECRET: mock_ci_secret
  BOT_BACKEND_URL: http://localhost:9000
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-lint:
    name: Python lint (syntax and undefined names)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install ruff
    # E9 = syntax errors, F63/F7 = invalid comparisons/statements,
    # F82 = undefined names. These are bugs, not style.
    - name: Ruff (correctness rules only)
      run: >
        ruff check backends/bot-backend/app backends/user-backend/app
        backends/admin-backend/app backends/shared/shared_lib
        --select E9,F63,F7,F82 --output-format=concise | tee "$RUNNER_TEMP/ruff.log"
      shell: bash -o pipefail {0}
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Python lint" "$RUNNER_TEMP/ruff.log"

  bot-backend-tests:
    name: Bot backend tests
    # Pinned: the backup/restore drills run the runner's pg_dump/pg_restore against the postgres:16 service (the
    # staging version). On ubuntu-26.04 (ubuntu-latest since late October 2026, newer PostgreSQL client) the
    # restore drill's pg_restore failed against the 16 service; on ubuntu-24.04 it passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # The platform layer (tests/platform_workers) runs every test on SQLite AND on this PostgreSQL server; the
    # REQUIRED flag makes a missing server a failure instead of a silent skip. The legacy adapter's own tests
    # (tests/test_legacy_postgres_adapter.py) use the same server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cfci
          POSTGRES_PASSWORD: cfci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_TEST_POSTGRES_URL: postgresql://cfci:cfci@127.0.0.1:5432/postgres
      PLATFORM_TEST_POSTGRES_REQUIRED: "1"
      LEGACY_TEST_POSTGRES_URL: postgresql://cfci:cfci@127.0.0.1:5432/postgres
      LEGACY_TEST_POSTGRES_REQUIRED: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backends/bot-backend/requirements.txt
          deploy/constraints.txt
    - name: Install dependencies (same pins as the server)
      run: |
        pip install -e backends/shared
        pip install -r backends/bot-backend/requirements.txt -c deploy/constraints.txt
        pip install pytest-asyncio pytest-mock pyyaml -c deploy/constraints.txt
    - name: Point tests at a throwaway database
      run: echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/cosmicforge-ci-bot.db" >> "$GITHUB_ENV"
    - name: Run tests
      run: python -m pytest backends/bot-backend/tests -q --tb=short -p no:cacheprovider -p ci_quarantine --junitxml="$RUNNER_TEMP/bot.xml"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Bot backend tests" "$RUNNER_TEMP/bot.xml"

  legacy-runtime-postgres:
    name: Legacy runtime on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Step 5.1 (EXT-DB-01): the existing legacy trading-runtime modules (tests/legacy_postgres_modules.txt) run
    # unchanged with every DB() routed to a throwaway PostgreSQL database by tests/legacy_pg_plugin.py. Tests that
    # exercise SQLite itself are deselected with their reasons (tests/legacy_postgres_test_side.txt); they still run
    # on SQLite in the bot job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cfci
          POSTGRES_PASSWORD: cfci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEGACY_TEST_POSTGRES_URL: postgresql://cfci:cfci@127.0.0.1:5432/postgres
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backends/bot-backend/requirements.txt
          deploy/constraints.txt
    - name: Install dependencies (same pins as the server)
      run: |
        pip install -e backends/shared
        pip install -r backends/bot-backend/requirements.txt -c deploy/constraints.txt
        pip install pytest-asyncio pytest-mock -c deploy/constraints.txt
    - name: Point tests at a throwaway database
      run: echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/cosmicforge-ci-legacy-pg.db" >> "$GITHUB_ENV"
    - name: Run the legacy runtime modules on PostgreSQL
      working-directory: backends/bot-backend
      run: bash tests/run_legacy_postgres.sh -p ci_quarantine --junitxml="$RUNNER_TEMP/legacy-pg.xml"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Legacy runtime on PostgreSQL" "$RUNNER_TEMP/legacy-pg.xml"

  user-backend-tests:
    name: User backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backends/user-backend/requirements.txt
          deploy/constraints.txt
    - name: Install dependencies
      run: |
        pip install -e backends/shared
        pip install -r backends/user-backend/requirements.txt -c deploy/constraints.txt
        pip install pytest pytest-asyncio pytest-mock -c deploy/constraints.txt
    - name: Point tests at a throwaway database
      run: echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/cosmicforge-ci-user.db" >> "$GITHUB_ENV"
    - name: Run tests
      working-directory: backends/user-backend
      run: python -m pytest tests -q --tb=short -p no:cacheprovider -p ci_quarantine --junitxml="$RUNNER_TEMP/user.xml"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "User backend tests" "$RUNNER_TEMP/user.xml"

  admin-and-shared-tests:
    name: Admin backend, shared library and root unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          backends/bot-backend/requirements.txt
          backends/user-backend/requirements.txt
          deploy/constraints.txt
    - name: Install dependencies
      run: |
        pip install -e backends/shared
        pip install -r backends/bot-backend/requirements.txt -c deploy/constraints.txt
        pip install -r backends/user-backend/requirements.txt -c deploy/constraints.txt
        pip install pytest-asyncio pytest-mock -c deploy/constraints.txt
    - name: Point tests at a throwaway database
      run: echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/cosmicforge-ci-root.db" >> "$GITHUB_ENV"
    - name: Admin backend tests
      if: always()
      run: python -m pytest backends/admin-backend/tests -q --tb=short -p no:cacheprovider -p ci_quarantine --junitxml="$RUNNER_TEMP/admin.xml"
    - name: Shared library tests
      if: always()
      run: python -m pytest backends/shared/tests -q --tb=short -p no:cacheprovider -p ci_quarantine --junitxml="$RUNNER_TEMP/shared.xml"
    # tests/integration needs both backends running on localhost and is not
    # part of the default run; see tests/integration/README.md.
    - name: Root unit tests
      if: always()
      run: python -m pytest tests -q --tb=short -p no:cacheprovider -p ci_quarantine --ignore=tests/integration --junitxml="$RUNNER_TEMP/root.xml"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Admin, shared and root tests" "$RUNNER_TEMP/admin.xml" "$RUNNER_TEMP/shared.xml" "$RUNNER_TEMP/root.xml"

  frontend-user:
    name: User frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/user-frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontends/user-frontend/package-lock.json
    - run: npm ci
    - name: Lint
      shell: bash -o pipefail {0}
      run: npx eslint . -f json -o "$RUNNER_TEMP/eslint.json" || (npx eslint . 2>&1 | tail -n 40; exit 1)
    - name: Unit tests
      if: always()
      shell: bash -o pipefail {0}
      run: npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
    - name: Build
      if: always()
      shell: bash -o pipefail {0}
      run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Frontend (${{ github.job }})" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/eslint.json"

  frontend-admin:
    name: Admin frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin-frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontends/admin-frontend/package-lock.json
    - run: npm ci
    - name: Lint
      shell: bash -o pipefail {0}
      run: npx eslint . -f json -o "$RUNNER_TEMP/eslint.json" || (npx eslint . 2>&1 | tail -n 40; exit 1)
    - name: Unit tests
      if: always()
      shell: bash -o pipefail {0}
      run: npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
    - name: Build
      if: always()
      shell: bash -o pipefail {0}
      run: npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
    - name: Post failure summary to the pull request
      if: failure() && github.event_name == 'pull_request'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/ci_report.py" "Frontend (${{ github.job }})" "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/eslint.json"

  containers:
    name: Containers (build, migrate job, API smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_TAG: ci-${{ github.sha }}
    steps:
    - uses: actions/checkout@v4
    - name: Build backend images
      run: |
        for svc in bot-backend user-backend; do
          docker build -f deploy/containers/backend.Dockerfile --build-arg SERVICE=$svc \
            --build-arg BUILD_REVISION=${{ github.sha }} -t cosmicforge/$svc:$IMAGE_TAG .
        done
    - name: Image carries no local state or credentials
      run: |
        docker run --rm cosmicforge/bot-backend:$IMAGE_TAG sh -c \
          'test -z "$(find /srv/cosmicforge -name .env -o -name "*.db" -o -name "*firebase-adminsdk*" | head -1)" && id -u | grep -qv "^0$"'
    - name: Staging stack -- migrate job and bot API process
      working-directory: deploy/staging
      run: |
        mkdir -p secrets && echo "ci-only-$RANDOM$RANDOM" > secrets/postgres_password
        sed -e "s#<secret>#ci-placeholder#g" \
            -e "s#^PLATFORM_DATABASE_URL=.*#PLATFORM_DATABASE_URL=postgresql://cosmicforge:$(cat secrets/postgres_password)@postgres:5432/cosmicforge#" \
            staging.env.example > staging.env
        docker compose -f docker-compose.staging.yml config -q
        docker compose -f docker-compose.staging.yml up -d postgres
        docker compose -f docker-compose.staging.yml run --rm migrate
        docker compose -f docker-compose.staging.yml run --rm migrate python -m shared_lib.persistence.sql migrate | tee second.json
        grep -q '"applied": \[\]' second.json
        docker compose -f docker-compose.staging.yml run --rm migrate python -m shared_lib.persistence.sql check-compat --app-min 1 --app-max 99
        docker compose -f docker-compose.staging.yml up -d --no-deps bot-api
        for i in $(seq 1 60); do
          docker compose -f docker-compose.staging.yml exec -T bot-api curl -fsS http://127.0.0.1:8000/health > health.json && break
          sleep 3
        done
        python3 -c "import json;d=json.load(open('health.json'));assert d['process_role']=='api',d.get('process_role');print('bot-api ready, role api')"
        test "$(docker compose -f docker-compose.staging.yml exec -T bot-api curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/emergency/flatten)" = 409
    - name: API replica refuses the mounted emergency router (refused before auth; nothing is executed)
      working-directory: deploy/staging
      run: |
        test "$(docker compose -f docker-compose.staging.yml exec -T bot-api curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/admin/emergency/flatten)" = 409
    - name: Stack logs on failure
      if: failure()
      working-directory: deploy/staging
      run: docker compose -f docker-compose.staging.yml logs --no-color --tail 200 || true
    # Failure drill with the REAL deploy.sh / rollback.sh on this runner's Docker: a release of this commit is
    # deployed, then a release that never becomes ready (503) is deployed on top of it; deploy.sh must reject it
    # through its release gate and roll back on its own, and the previous release must be the one serving. It also
    # checks how the replaced trading process stopped (SIGTERM drain, never SIGKILL). The drill is its own compose
    # project on a network with no route off the runner. It is a disposable CI check of the scripts and the images,
    # NOT evidence of sustained staging or production operation (EXT-STG-01 still needs an authorized host).
    - name: Failure drill -- unready release rolled back automatically by deploy.sh
      working-directory: deploy/staging
      timeout-minutes: 15
      env:
        COMPOSE_PROJECT_NAME: cfdrill
        DEPLOY_COMPOSE_OVERRIDE: ${{ github.workspace }}/deploy/staging/drill/no-egress.override.yml
        DEPLOY_API_SERVICES: bot-api
        DEPLOY_POLL_INTERVAL_S: "3"
      run: |
        set -euo pipefail
        C="docker compose -f docker-compose.staging.yml -f $DEPLOY_COMPOSE_OVERRIDE"
        IMAGE_TAG=ci-good $C config --services > services-default.txt
        if grep -qx bot-trading-assigned services-default.txt; then echo "optional worker enabled by default"; exit 1; fi
        COMPOSE_PROFILES=multi-worker IMAGE_TAG=ci-good $C config --services | grep -qx bot-trading-assigned
        docker tag cosmicforge/bot-backend:$IMAGE_TAG cosmicforge/bot-backend:ci-good
        docker build -f drill/unready-release.Dockerfile --build-arg BASE_IMAGE=cosmicforge/bot-backend:$IMAGE_TAG \
          -t cosmicforge/bot-backend:ci-bad drill
        DEPLOY_READY_TIMEOUT_S=300 bash deploy.sh ci-good
        test "$(cat .deploy-state/current_tag)" = ci-good
        rc=0
        DEPLOY_READY_TIMEOUT_S=60 DEPLOY_ROLLBACK_READY_TIMEOUT_S=300 bash deploy.sh ci-bad || rc=$?
        test "$rc" = 11
        test "$(cat .deploy-state/current_tag)" = ci-good
        cid="$(IMAGE_TAG=ci-good $C ps -q bot-trading)"
        test "$(docker inspect -f '{{.Config.Image}}' "$cid")" = cosmicforge/bot-backend:ci-good
        IMAGE_TAG=ci-good $C exec -T bot-trading curl -fsS 'http://127.0.0.1:8000/health?ready=1' > drill-health.json
        python3 - <<'EOF'
        import glob, json
        result = json.load(open(".deploy-state/last_result.json"))
        assert (result["operation"], result["status"], result["serving_tag"]) == ("deploy", "ROLLED_BACK", "ci-good"), result
        assert '"reason": "HTTP_503"' in result["detail"], result["detail"]
        statuses = [json.loads(line)["status"] for line in open(".deploy-state/history.jsonl")]
        assert statuses == ["DEPLOYED", "ROLLED_BACK", "ROLLED_BACK"], statuses
        assert json.load(open("drill-health.json"))["process_role"] == "trading"
        drains = [json.loads(line) for p in sorted(glob.glob(".deploy-state/drain-*.jsonl")) for line in open(p)]
        print(json.dumps(drains, indent=1))
        replaced = [d for d in drains if d["outgoing_tag"] == "ci-good"]
        assert len(replaced) == 1 and replaced[0]["outcome"] in ("DRAINED", "EXITED_ON_SIGTERM"), drains
        assert replaced[0]["quiesce"] != "not_logged", "the replaced trading process never ran its shutdown path"
        if replaced[0]["quiesce"] != "clean":
            print("WARNING: the replaced trading process reported an unclean quiesce; see .deploy-state/logs")
        print("drill passed: unready release rejected, previous release serving, trading drained on SIGTERM")
        EOF
    - name: Failure drill state and logs on failure
      if: failure()
      working-directory: deploy/staging
      env:
        COMPOSE_PROJECT_NAME: cfdrill
      run: |
        for f in .deploy-state/*.log .deploy-state/*.json .deploy-state/*.jsonl .deploy-state/logs/*; do
          [ -f "$f" ] && { echo "== $f"; tail -n 60 "$f"; }
        done || true
        IMAGE_TAG=ci-good docker compose -f docker-compose.staging.yml -f drill/no-egress.override.yml logs --no-color --tail 200 || true
