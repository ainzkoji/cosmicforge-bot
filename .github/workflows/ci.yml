name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      EXECUTION_MODE: paper
      BINANCE_API_KEY: mock_ci_key
      BINANCE_API_SECRET: mock_ci_secret
      BOT_BACKEND_URL: http://localhost:9000
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install shared lib in editable mode
        pip install -e backends/shared
        # Install backend dependencies
        pip install -r backends/bot-backend/requirements.txt
        pip install -r backends/user-backend/requirements.txt
        # Install test dependencies (if separate, otherwise assume included above)
        pip install pytest pytest-asyncio httpx pytest-mock

    - name: Run Root Integration Tests
      run: |
        python -m pytest tests

    - name: Run Bot Parity Tests
      run: |
        python -m pytest backends/bot-backend/tests

  frontend-user-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/user-frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontends/user-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

  frontend-admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/admin-frontend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontends/admin-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      # Run lint if configured, otherwise warn
      run: npm run lint || echo "Lint script missing or failed (non-blocking for now)"

    - name: Build
      run: npm run build
